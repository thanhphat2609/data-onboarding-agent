# Stage 1 of CI/CD: checks on every pull request and every push to main. Nothing is deployed here;
# a green run on main is what the Deploy workflow (stage 2) waits for. Same flow as data-onboarding-ingestion.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (syntax, imports)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt ruff==0.17.2
      # Only errors that break at runtime: syntax errors, undefined names, invalid comparisons.
      - name: Ruff (errors only)
        run: ruff check --no-cache --select E9,F63,F7,F82 .
      - name: Compile
        run: python -m compileall -q agent app.py
      # Builds the graph and the UI without starting the server; no network or database needed.
      - name: Import the app
        run: python -c "import app"

  docker:
    name: Compose files and image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts parse
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Dummy .env files
        run: |
          for example in $(git ls-files '*.env.example'); do
            sed 's/__GENERATE__/ci-dummy/' "$example" > "${example%.example}"
          done
      - name: Compose files are valid
        run: |
          for file in $(git ls-files '*docker-compose.yml'); do
            echo "::group::$file"
            docker compose --env-file "$(dirname "$file")/.env" -f "$file" config --quiet
            echo "::endgroup::"
          done
      - name: Build the image (not pushed)
        run: docker compose -f infrastructure/non-prod/docker-compose.yml build
