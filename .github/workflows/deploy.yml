# Stage 2 of CI/CD: deploys VM 1 only when someone runs this workflow (Actions -> Deploy -> Run workflow); that
# click is the approval. The commit must be on main and have a green CI run. The prod .env is written from the
# repository secrets and variables (infrastructure/prod/render_env.py) and checked with `docker compose config`,
# then over SSH: .env to the VM, git checkout <sha>, docker compose build --pull, up -d, prune old images and cache.
# Disabled until the repository variable PROD_DEPLOY_ENABLED is "true" (VM 1 doesn't exist yet).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (default latest main)
        required: false
      no_cache:
        description: Rebuild the image without the Docker layer cache
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # to check the CI result of the commit

jobs:
  deploy:
    if: vars.PROD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
      REPO_DIR: ${{ vars.PROD_REPO_DIR || '/opt/data-onboarding-agent' }}
      HOST: ${{ secrets.PROD_VM1_HOST }}
      NO_CACHE: ${{ inputs.no_cache && '--no-cache' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.sha || 'origin/main' }}
        run: |
          sha=$(git rev-parse "$TARGET")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"; exit 1
          fi
          green=$(gh run list --workflow CI --commit "$sha" --status success --json databaseId --jq length)
          if [[ "$green" == 0 ]]; then
            echo "::error::No green CI run for $sha; wait for CI or fix it first"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Every prod setting lives in GitHub: the keys of the target commit's .env.example, each from the secret or
      # variable of the same name. Fails before touching the VM if a required one is missing.
      - name: Write .env from secrets and variables
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          git checkout --quiet --detach "$SHA"
          python3 infrastructure/prod/render_env.py infrastructure/prod/.env.example "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" -f infrastructure/prod/docker-compose.yml config --quiet
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Deploy VM 1
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$HOST" \
            "set -e; umask 077; cat > '$REPO_DIR/infrastructure/prod/.env.new'; mv '$REPO_DIR/infrastructure/prod/.env.new' '$REPO_DIR/infrastructure/prod/.env'" \
            < "$RUNNER_TEMP/prod.env"
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$HOST" \
            "set -e; cd '$REPO_DIR'; git fetch --prune origin; git show '$SHA:infrastructure/prod/deploy.sh' | bash -s -- '$SHA' $NO_CACHE"
