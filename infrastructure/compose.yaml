# Run the web UI in Docker: laptop, VM or GitHub Codespaces. From the repo root:
#   docker compose -f infrastructure/compose.yaml up -d --build
#   -> http://127.0.0.1:7860   (Codespaces: PORTS tab)
# Settings come from shell env vars (e.g. Codespaces secrets) or infrastructure/.env (copy .env.example).
name: data-onboarding-agent

services:
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    image: data-onboarding-agent:latest
    # Localhost only: the app has no login. On a VM use an SSH tunnel or a reverse proxy with auth.
    ports:
      - "127.0.0.1:${UI_PORT:-7860}:7860"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      DBT_GITHUB_TOKEN: ${DBT_GITHUB_TOKEN:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      WEB_RESEARCH: ${WEB_RESEARCH:-1}
      REVIEWER_KEY: ${REVIEWER_KEY:-}
      # Sessions live next to the other results, so everything the app writes is in outputs/ on the host.
      CHECKPOINT_DB: /app/outputs/checkpoints.db
    volumes:
      - ../outputs:/app/outputs           # checkpoints.db, user stories, feasibility, eval reports
      - ../catalog:/app/catalog           # catalog synced from the UI survives rebuilds
      - ../playbooks:/app/playbooks:ro    # edit playbooks on the host, then restart
    # Lets OLLAMA_HOST=http://host.docker.internal:11434 reach Ollama on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
