# Non-prod Docker Compose for data-onboarding-agent: the web UI + PostgreSQL on a laptop or GitHub Codespaces.
# (Prod on VM 1 gets infrastructure/prod/ once the VM exists.) From the repo root:
#   docker compose -f infrastructure/non-prod/docker-compose.yml up -d --build
#   -> http://127.0.0.1:7860   (Codespaces: PORTS tab)
# Settings come from shell env vars (e.g. Codespaces secrets) or infrastructure/non-prod/.env (copy .env.example).
name: data-onboarding-agent

services:
  # ─────────────────────────────────────────────
  # PostgreSQL: the platform's one server, one database per owner (postgres/init/01-databases.sh)
  #   onboarding_agent  this app's sessions
  #   airflow           Airflow metadata DB      } data-onboarding-orchestration's Airflow joins the
  #   platform          ingestion run records    } data-platform network and connects to postgres:5432
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine   # same pin as data-onboarding-ingestion (its architecture: PostgreSQL 16)
    container_name: data-onboarding-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Read by the init script on the first start only (empty volume). The orchestration repo's .env must use the
      # same values as AIRFLOW_DB_PASSWORD / PLATFORM_DB_PASSWORD.
      AGENT_DB_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-agent}
      AIRFLOW_DB_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-airflow}
      PLATFORM_DB_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    # Localhost only: psql / DBeaver from the host (docs/postgresql.md). Airflow joins the network instead.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [default, platform]
    healthcheck:
      # Over TCP: during the first-start init the entrypoint runs a socket-only temporary server, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d onboarding_agent"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # SearXNG: self-hosted metasearch for web research, no API key (infrastructure/searxng/settings.yml).
  # No published port: only the app reaches it, as http://searxng:8080.
  # ─────────────────────────────────────────────
  searxng:
    image: searxng/searxng:2026.9.30-a9d990033
    container_name: data-onboarding-searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-data-onboarding-agent-non-prod}
      FORCE_OWNERSHIP: "false"   # settings are mounted read-only; don't chown them
    volumes:
      - ../searxng:/etc/searxng:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Web UI + agent (Gradio)
  # ─────────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: infrastructure/Dockerfile
      args:
        WITH_BROWSER: ${WITH_BROWSER:-false}   # true = headless Chromium for web research (~400 MB)
    image: data-onboarding-agent:latest
    container_name: data-onboarding-agent
    # Localhost only. The login (ACCOUNTS) is a prototype's: on a VM use an SSH tunnel or a reverse proxy with TLS.
    ports:
      - "127.0.0.1:${UI_PORT:-7860}:7860"
    environment:
      # LLM: empty OLLAMA_MODEL = rule-based
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # The two repos the agent reads (agent/repos); the token must be able to read both. PLATFORM_GITHUB_TOKEN wins:
      # Codespaces presets GITHUB_TOKEN (own repo only) and doesn't allow a secret named GITHUB_*.
      PLATFORM_GITHUB_TOKEN: ${PLATFORM_GITHUB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      INGESTION_REPO: ${INGESTION_REPO:-thanhphat2609/data-onboarding-ingestion}
      INGESTION_REF: ${INGESTION_REF:-main}
      TRANSFORMATION_REPO: ${TRANSFORMATION_REPO:-thanhphat2609/data-onboarding-transformation}
      TRANSFORMATION_REF: ${TRANSFORMATION_REF:-main}
      # Login: empty ACCOUNTS = no login, every tab open
      ACCOUNTS: ${ACCOUNTS:-}
      DATA_TEAM: ${DATA_TEAM:-data.team@gmail.com}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      WEB_RESEARCH: ${WEB_RESEARCH:-1}
      WEBSEARCH_BROWSER: ${WEBSEARCH_BROWSER:-auto}
      # First search engine; empty = only the key-less scrapers (Bing/Brave/DuckDuckGo)
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Sessions (checkpoints + sessions table) in PostgreSQL. Point DATABASE_URL elsewhere for an external server;
      # a password with special characters must be URL-encoded here.
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent:${POSTGRES_AGENT_PASSWORD:-agent}@postgres:5432/onboarding_agent}
    volumes:
      - ../../outputs:/app/outputs   # user stories, feasibility, Teams messages, eval reports
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started   # research falls back to the other engines if it isn't up yet
    # Lets OLLAMA_HOST=http://host.docker.internal:11434 reach Ollama on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true   # forwards Ctrl+C / docker stop to Python and reaps child processes (headless Chromium)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860', timeout=4)\""]
      interval: 30s
      timeout: 5s
      start_period: 40s   # first start reads both repos from GitHub
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  default: {}
  # Shared with data-onboarding-orchestration: its Airflow reaches this server as postgres:5432 on this network,
  # so start this stack first (the ingestion and orchestration compose files declare it external).
  platform:
    name: data-platform

volumes:
  pgdata:   # PostgreSQL data; survives `down`, deleted by `down -v`
