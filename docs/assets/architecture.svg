  <path class="edge" d="M475 198 V210" marker-end="url(#arr)"/>
  <path class="edge pre" d="M690 280 H730 V120 H768" marker-end="url(#arr)"/>
  <path class="edge pre" d="M690 300 H720 V194 H768" marker-end="url(#arr)"/>
  <path class="edge pre" d="M690 320 H710 V268 H768" marker-end="url(#arr)"/>
  <path class="aux" d="M690 380 H740 V445 H768" marker-end="url(#arrm)"/>
  <path class="aux" d="M690 420 H730 V534 H768" marker-end="url(#arrm)"/>
  <path class="edge pre" d="M260 360 H225 V315 H202" marker-end="url(#arr)"/>
  <path class="aux" d="M475 470 V484" marker-end="url(#arrm)"/>
  <path class="edge" d="M587 572 V604 H1125 V582" marker-end="url(#arr)"/>
  <path class="edge" d="M1125 468 V412" marker-end="url(#arr)"/>
  <circle class="badge" cx="229" cy="128" r="10"/><text class="bn" x="229" y="132">1</text>
  <circle class="badge" cx="730" cy="200" r="10"/><text class="bn" x="730" y="204">2</text>
  <circle class="badge" cx="215" cy="330" r="10"/><text class="bn" x="215" y="334">3</text>
  <circle class="badge" cx="860" cy="604" r="10"/><text class="bn" x="860" y="608">4</text>
  <text class="bs" x="20" y="624">1 requester chats · 2 feasibility reads the repos · 3 Teams card · 4 approved request → User Stories. Dashed repo box: the agent still reads connections and jobs from the ingestion repository.</text>
</svg>
