<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 632" width="1240" height="632" role="img" aria-labelledby="t d">
  <title id="t">data-onboarding-agent architecture</title>
  <desc id="d">A requester describes the data they need in a Gradio chat. A LangGraph state machine fills a seven-field request, checks the templates and jobs of the ingestion and orchestration repositories and the dbt models of the transformation repository, researches new sources on the web, and waits for the requester and then the Data Team to approve. It writes a parent User Story and three linked ones and posts to Teams. PostgreSQL stores sessions and checkpoints; an LLM is optional.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #14232C; }
    .bg { fill: #FFFFFF; }
    .zone { fill: #E7EEF0; }
    .zl { font-family: Consolas, "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.08em; fill: #586A75; }
    .box { fill: #FFFFFF; stroke: #C6D3D9; stroke-width: 1.2; }
    .hl { stroke: #0D776F; stroke-width: 1.6; }
    .dash { fill: none; stroke: #586A75; stroke-dasharray: 5 4; }
    .run { fill: #D3ECE8; stroke: #0D776F; stroke-dasharray: 6 4; }
    .row { fill: #E7EEF0; }
    .bt { font-size: 13px; font-weight: 600; }
    .rt { font-size: 12.5px; font-weight: 600; }
    .bs { font-family: Consolas, "JetBrains Mono", monospace; font-size: 10.5px; fill: #586A75; }
    .edge { fill: none; stroke: #0D776F; stroke-width: 1.6; }
    .pre { stroke-dasharray: 5 4; }
    .aux { fill: none; stroke: #586A75; stroke-dasharray: 3 3; stroke-width: 1.2; }
    .ah { fill: #0D776F; }
    .ahm { fill: #586A75; }
    .badge { fill: #0D776F; }
    .badge-a { fill: #9A5B12; }
    .bn { fill: #FFFFFF; font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; }
    .el { font-family: Consolas, "JetBrains Mono", monospace; font-size: 10.5px; fill: #586A75; }
    .title { font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1240" height="632"/>
  <text class="title" x="20" y="28">data-onboarding-agent</text>
  <text class="bs" x="20" y="44">turns a data request into ready-to-build User Stories · people approve twice</text>
  <text class="zl" x="20" y="92">PEOPLE</text>
  <rect class="box" x="20" y="100" width="180" height="56" rx="8"/>
  <text class="bt" x="34" y="122">Requester</text>
  <text class="bs" x="34" y="140">chat · approves the draft</text>
  <rect class="box" x="20" y="180" width="180" height="56" rx="8"/>
  <text class="bt" x="34" y="202">Data Team</text>
  <text class="bs" x="34" y="220">review tab · approves</text>
  <rect class="dash" x="20" y="270" width="180" height="90" rx="8"/>
  <text class="bt" x="34" y="292">Microsoft Teams</text>
  <text class="bs" x="34" y="310">card once per request</text>
  <text class="bs" x="34" y="326">webhook or mock file</text>
  <rect class="zone" x="240" y="60" width="470" height="530" rx="10"/>
  <text class="zl" x="258" y="82">WEB APP · GRADIO + LANGGRAPH · VM 1</text>
  <rect class="box" x="260" y="90" width="430" height="54" rx="8"/>
  <text class="bt" x="274" y="112">Web UI · Gradio</text>
  <text class="bs" x="274" y="130">Request · Sessions · Data Team review · Settings</text>
  <rect class="box" x="260" y="158" width="430" height="40" rx="8"/>
  <text class="bt" x="274" y="180">AgentRunner</text>
  <text class="bs" x="274" y="198">new_request · stream · reply · current_event</text>
  <rect class="box hl" x="260" y="212" width="430" height="258" rx="8"/>
  <text class="bt" x="274" y="234">LangGraph state machine</text>
  <rect class="row" x="272" y="246" width="406" height="28" rx="6"/>
  <text class="rt" x="284" y="265">intake ⇄ ask_user</text>
  <text class="bs" x="668" y="265" text-anchor="end">7 fields · max 3 questions</text>
  <rect class="row" x="272" y="280" width="406" height="28" rx="6"/>
  <text class="rt" x="284" y="299">catalog_check → feasibility</text>
  <text class="bs" x="668" y="299" text-anchor="end">per source and table</text>
  <rect class="row" x="272" y="314" width="406" height="28" rx="6"/>
  <text class="rt" x="284" y="333">investigate_source</text>
  <text class="bs" x="668" y="333" text-anchor="end">new sources only</text>
  <rect class="row" x="272" y="348" width="406" height="28" rx="6"/>
  <text class="rt" x="284" y="367">requester_review</text>
  <text class="bs" x="668" y="367" text-anchor="end">interrupt: draft</text>
  <rect class="row" x="272" y="382" width="406" height="28" rx="6"/>
  <text class="rt" x="284" y="401">approval</text>
  <text class="bs" x="668" y="401" text-anchor="end">interrupt: Data Team</text>
  <rect class="row" x="272" y="416" width="406" height="28" rx="6"/>
  <text class="rt" x="284" y="435">draft_us → summary</text>
  <text class="bs" x="668" y="435" text-anchor="end">3 User Stories</text>
  <rect class="box" x="260" y="486" width="205" height="86" rx="8"/>
  <text class="bt" x="274" y="508">PostgreSQL</text>
  <text class="bs" x="274" y="526">sessions · checkpoints</text>
  <text class="bs" x="274" y="542">requesters (scrypt)</text>
  <rect class="box" x="485" y="486" width="205" height="86" rx="8"/>
  <text class="bt" x="499" y="508">outputs/&lt;request_id&gt;</text>
  <text class="bs" x="499" y="526">user_story.md · 3 stories</text>
  <text class="bs" x="499" y="542">summary.md · zip</text>
  <rect class="zone" x="750" y="60" width="260" height="300" rx="10"/>
  <text class="zl" x="768" y="82">PLATFORM REPOS · READ-ONLY</text>
  <rect class="box" x="770" y="90" width="220" height="60" rx="8"/>
  <text class="bt" x="784" y="112">data-onboarding-ingestion</text>
  <text class="bs" x="784" y="130">source + sink templates</text>
  <rect class="dash" x="770" y="164" width="220" height="60" rx="8"/>
  <text class="bt" x="784" y="186">data-onboarding-orchestration</text>
  <text class="bs" x="784" y="204">connections · jobs (to switch)</text>
  <rect class="box" x="770" y="238" width="220" height="60" rx="8"/>
  <text class="bt" x="784" y="260">data-onboarding-transformation</text>
  <text class="bs" x="784" y="278">dbt models</text>
  <text class="bs" x="770" y="330">GitHub API, fine-grained read token</text>
  <rect class="zone" x="750" y="380" width="260" height="210" rx="10"/>
  <text class="zl" x="768" y="402">OPTIONAL</text>
  <rect class="dash" x="770" y="410" width="220" height="70" rx="8"/>
  <text class="bt" x="784" y="432">Ollama LLM</text>
  <text class="bs" x="784" y="450">language only · local or Colab</text>
  <text class="bs" x="784" y="466">decisions stay in code</text>
  <rect class="dash" x="770" y="496" width="220" height="76" rx="8"/>
  <text class="bt" x="784" y="518">SearXNG → public docs</text>
  <text class="bs" x="784" y="536">advisory, marked unverified</text>
  <text class="bs" x="784" y="552">fallback: Brave · ddgs</text>
  <rect class="zone" x="1030" y="60" width="190" height="530" rx="10"/>
  <text class="zl" x="1048" y="82">OUTPUT</text>
  <rect class="dash" x="1050" y="330" width="150" height="80" rx="8"/>
  <text class="bt" x="1064" y="352">Build work</text>
  <text class="bs" x="1064" y="370">the Data Team</text>
  <text class="bs" x="1064" y="386">picks it up</text>
  <rect class="box" x="1050" y="470" width="150" height="110" rx="8"/>
  <text class="bt" x="1064" y="492">Parent User Story</text>
  <text class="bs" x="1064" y="510">+ spike</text>
  <text class="bs" x="1064" y="526">+ ingestion</text>
  <text class="bs" x="1064" y="542">+ transformation</text>
