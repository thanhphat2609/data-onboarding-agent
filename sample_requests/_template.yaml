# Template for a REAL past request (Phase 5). Copy to e.g. `01_<short_name>.yaml` and fill in.
# Files starting with `_` are skipped by the runner.
#   python scripts/run_samples.py sample_requests
# Use metadata only: no real data values, credentials or personal information.

name: <one line describing the request>
today: "YYYY-MM-DD"            # the date the request was originally made, so ETA/date checks behave as they did then

# What the requester first wrote (copy from the original Teams message / ticket, light anonymising is fine).
initial_message: |
  <original request text>

# The requester's answers, in order, to the agent's follow-up questions.
# Run once with an empty list to see what the agent asks, then fill these in.
answers: []

# Reviewer decisions at the approval step.
approval:
  - {action: approve}
  # - {action: edit, comment: "change eta to 2026-11-01"}

# Optional: what the agent SHOULD do (pass/fail checks).
expected:
  max_turns: 5
  # gap_types: [date_range]        # date_range / unknown_source
  # data_already_available: true
  # recommendation: {ga4: fct_ga4__sessions_daily}
  # final_date_start: "2024-01-01"
  # final_eta: "2026-11-30"

# How the Data Team ACTUALLY handled it. Every difference goes into outputs/eval/<run>/mistakes.csv.
team_handling:
  # data_already_available: false
  # gap_types: [date_range]
  # recommendation: {ga4: stg_ga4__events}   # model / access method the team actually used
  # date_start: "2024-01-01"                  # start date the team actually delivered
  # eta: "2026-11-30"                         # go-live date agreed with the requester
  notes: |
    <what the team did, anything the agent could not know>
